[package]
name = "swiftwall"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.89"

description = "Event-driven wallpaper carousel for Omarchy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rand = "0.9"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
lto = "thin"
strip = true
